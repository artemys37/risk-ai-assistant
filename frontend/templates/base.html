<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SPRINT — Analyse de risques{% endblock %}</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --line: #334155; --text: #e2e8f0;
      --muted: #94a3b8; --accent: #38bdf8; --ok: #34d399; --warn: #fbbf24;
      --bad: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
    }
    nav {
      display: flex; gap: 1rem; align-items: center; padding: .8rem 1.4rem;
      background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap;
    }
    nav .brand { font-weight: 700; color: var(--accent); text-decoration: none; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover { color: var(--text); }
    main { max-width: 1150px; margin: 1.6rem auto; padding: 0 1.4rem; }
    h1 { font-size: 1.4rem; margin: 0 0 .4rem; }
    h2 { font-size: 1.1rem; margin: 1.6rem 0 .6rem; color: var(--accent); }
    .muted { color: var(--muted); }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1rem; }
    .kpi { font-size: 1.6rem; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    th, td { padding: .5rem .7rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; font-size: .9rem; }
    th { background: #24344a; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
    tr:last-child td { border-bottom: none; }
    input[type=file], input[type=text], input[type=number], select, textarea {
      background: #0b1626; color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: .5rem .6rem; font: inherit; width: 100%;
    }
    button, .btn {
      background: var(--accent); color: #0b1626; border: none; border-radius: 8px;
      padding: .55rem 1rem; font-weight: 700; cursor: pointer; font: inherit;
      text-decoration: none; display: inline-block;
    }
    button:hover, .btn:hover { filter: brightness(1.1); }
    .badge { display: inline-block; padding: .15rem .6rem; border-radius: 999px; font-size: .75rem; font-weight: 700; }
    .badge.ok { background: rgba(52,211,153,.15); color: var(--ok); }
    .badge.warn { background: rgba(251,191,36,.15); color: var(--warn); }
    .badge.bad { background: rgba(248,113,113,.15); color: var(--bad); }
    .badge.gray { background: #334155; color: var(--muted); }
    .stack { display: flex; flex-direction: column; gap: .6rem; }
    .rowform { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    .rowform > * { flex: 0; }
    details { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: .8rem 1rem; margin-bottom: .5rem; }
    summary { cursor: pointer; font-weight: 600; }
    pre { background: #0b1626; padding: .8rem; border-radius: 8px; overflow: auto; font-size: .8rem; }
    code { background: #0b1626; padding: .1rem .3rem; border-radius: 4px; }
    .flash, .error { border-radius: 8px; padding: .6rem .9rem; margin-bottom: 1rem; }
    .flash { background: rgba(52,211,153,.12); color: var(--ok); }
    .error { background: rgba(248,113,113,.12); color: var(--bad); }
    .progress { display: flex; gap: .25rem; margin: .8rem 0 1.2rem; flex-wrap: wrap; }
    .progress .step { font-size: .7rem; padding: .25rem .5rem; border-radius: 6px; background: #24344a; color: var(--muted); }
    .progress .step.done { background: rgba(52,211,153,.2); color: var(--ok); }
    .progress .step.current { background: var(--accent); color: #0b1626; font-weight: 700; }
    ul { margin: .3rem 0; padding-left: 1.2rem; }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="/">SPRINT · Risk AI Assistant</a>
    <a href="/analyses">Analyses</a>
    <a href="/docs">API</a>
    <a href="/api/health">Santé</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
